<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscription - ChronoTrail</title>
    <link rel="stylesheet" href="styles 2.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Préinscription aux courses ChronoTrail</h1>
            <p>Remplissez ce formulaire pour participer aux courses.</p>
        </header>

        <section>
            <form id="registration-form">
                <label for="nom">Nom :</label>
                <input type="text" id="nom" name="nom" required>

                <label for="prenom">Prénom :</label>
                <input type="text" id="prenom" name="prenom" required>

                <label for="email">Email :</label>
                <input type="email" id="email" name="email" required>

                <label for="telephone">Téléphone :</label>
                <input type="tel" id="telephone" name="telephone" required>

                <h3>Choisissez vos courses :</h3>
                <div id="checkbox-courses">
                    <!-- Cases à cocher générées dynamiquement par script.js -->
                </div>

                <button type="submit">S'inscrire</button>
            </form>
        </section>

        <footer>
            <p>&copy; 2025 ChronoTrail. Tous droits réservés.</p>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
