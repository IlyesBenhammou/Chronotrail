<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestion des Coureurs - Chronotrail</title>
    <link rel="stylesheet" href="Gestion_des_coureurs.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Gestion des Coureurs - Chronotrail</h1>
        </header>

        <main>
            <section class="coureurs-list">
                <h2>Liste des Coureurs</h2>
                <div class="search-bar">
                    <input type="text" id="search" placeholder="Rechercher un coureur...">
                </div>
                <div class="filters">
                    <select id="circuit-filter">
                        <option value="all">Tous les circuits</option>
                        <option value="10km">10km</option>
                        <option value="21km">21km</option>
                        <option value="42km">42km</option>
                    </select>
                    <select id="presence-filter">
                        <option value="all">Tous les états</option>
                        <option value="present">Présent</option>
                        <option value="absent">Absent</option>
                        <option value="non-verifie">Non vérifié</option>
                    </select>
                </div>
                <table id="coureurs-table">
                    <thead>
                        <tr>
                            <th>Dossard</th>
                            <th>Nom</th>
                            <th>Prénom</th>
                            <th>Âge</th>
                            <th>Sexe</th>
                            <th>Circuit</th>
                            <th>Présence</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="coureurs-body">
                        <!-- Les données seront ajoutées dynamiquement par JavaScript -->
                    </tbody>
                </table>
            </section>

            <section class="coureur-details" id="details-section" style="display: none;">
                <h2>Fiche du Coureur</h2>
                <div class="details-content">
                    <div class="detail-item">
                        <span class="detail-label">Numéro de dossard:</span>
                        <span id="detail-dossard" class="detail-value">-</span>
                    </div>
                    <div class="detail-item">
                        <span class="detail-label">Nom:</span>
                        <span id="detail-nom" class="detail-value">-</span>
                    </div>
                    <div class="detail-item">
                        <span class="detail-label">Prénom:</span>
                        <span id="detail-prenom" class="detail-value">-</span>
                    </div>
                    <div class="detail-item">
                        <span class="detail-label">Âge:</span>
                        <span id="detail-age" class="detail-value">-</span>
                    </div>
                    <div class="detail-item">
                        <span class="detail-label">Sexe:</span>
                        <span id="detail-sexe" class="detail-value">-</span>
                    </div>
                    <div class="detail-item">
                        <span class="detail-label">Circuit:</span>
                        <span id="detail-circuit" class="detail-value">-</span>
                    </div>
                    <div class="detail-item">
                        <span class="detail-label">Présence:</span>
                        <span id="detail-presence" class="detail-value">-</span>
                    </div>
                </div>
                <div class="details-actions">
                    <button id="btn-affecter-dossard" class="btn">Affecter Dossard</button>
                    <div class="presence-actions">
                        <button id="btn-present" class="btn btn-present">Présent</button>
                        <button id="btn-absent" class="btn btn-absent">Absent</button>
                    </div>
                </div>
                <button id="btn-retour" class="btn btn-retour">Retour à la liste</button>
            </section>
        </main>
    
        <footer>
            <p>&copy; 2025 ChronoTrail. Tous droits réservés.</p>
          </footer>
    </div>

    <script src="./Gestions_des_coureurs.js"></script>
</body>
</html>
