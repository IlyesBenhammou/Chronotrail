<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chronotrail – Gestion de Course</title>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet" />
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      position: relative;
      overflow-x: hidden;
    }

    body::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background:
        radial-gradient(circle at 20% 80%, rgba(120, 119, 198, 0.3) 0%, transparent 50%),
        radial-gradient(circle at 90% 20%, rgba(255, 255, 255, 0.1) 0%, transparent 50%);
      pointer-events: none;
    }

    .container {
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 24px;
      padding: 40px;
      width: 100%;
      max-width: 450px;
      text-align: center;
      box-shadow:
        0 25px 50px rgba(0, 0, 0, 0.15),
        0 0 0 1px rgba(255, 255, 255, 0.1) inset;
      position: relative;
      animation: slideUp 0.8s cubic-bezier(0.25, 0.46, 0.45, 0.94);
    }

    @keyframes slideUp {
      from {
        opacity: 0;
        transform: translateY(30px) scale(0.95);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .logo {
      background: linear-gradient(135deg, #ff6b6b, #ee5a24);
      width: 80px;
      height: 80px;
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 24px;
      box-shadow: 0 15px 35px rgba(238, 90, 36, 0.3);
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }

    .logo i {
      color: white;
      font-size: 32px;
    }

    h1 {
      color: white;
      font-size: 32px;
      font-weight: 700;
      margin-bottom: 8px;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.2);
    }

    h1 span {
      display: block;
      font-weight: 400;
      font-size: 16px;
      opacity: 0.9;
      margin-top: 4px;
    }

    .input-group {
      margin: 32px 0;
      text-align: left;
    }

    .input-group label {
      display: block;
      color: white;
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 8px;
      opacity: 0.9;
    }

    .input-wrapper {
      position: relative;
    }

    .input-icon {
      position: absolute;
      left: 16px;
      top: 50%;
      transform: translateY(-50%);
      color: #999;
      font-size: 16px;
      z-index: 2;
    }

    input {
      width: 100%;
      padding: 16px 16px 16px 48px;
      border: 2px solid rgba(255, 255, 255, 0.2);
      border-radius: 16px;
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(10px);
      color: white;
      font-size: 16px;
      font-weight: 500;
      transition: all 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94);
      outline: none;
    }

    input::placeholder {
      color: rgba(255, 255, 255, 0.6);
    }

    input:focus {
      border-color: rgba(255, 255, 255, 0.5);
      background: rgba(255, 255, 255, 0.15);
      transform: translateY(-2px);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
    }

    .buttons {
      display: flex;
      flex-direction: column;
      gap: 16px;
      margin-top: 32px;
    }

    button {
      padding: 16px 24px;
      border: none;
      border-radius: 16px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94);
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    button::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
      transition: left 0.5s;
    }

    button:hover::before {
      left: 100%;
    }

    .btn-start {
      background: linear-gradient(135deg, #10ac84, #00d2d3);
      color: white;
      box-shadow: 0 8px 25px rgba(16, 172, 132, 0.3);
    }

    .btn-stop {
      background: linear-gradient(135deg, #ff6b6b, #ee5a24);
      color: white;
      box-shadow: 0 8px 25px rgba(255, 107, 107, 0.3);
    }

    #message {
      margin-top: 24px;
      padding: 16px;
      border-radius: 12px;
      font-weight: 600;
      opacity: 0;
      transform: translateY(20px);
      transition: all 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
      backdrop-filter: blur(10px);
    }

    #message.show {
      opacity: 1;
      transform: translateY(0);
    }

    #message.success {
      background: rgba(16, 172, 132, 0.2);
      border: 1px solid rgba(16, 172, 132, 0.3);
      color: #10ac84;
    }

    #message.error {
      background: rgba(255, 107, 107, 0.2);
      border: 1px solid rgba(255, 107, 107, 0.3);
      color: #ff6b6b;
    }

    .loading {
      display: inline-block;
      width: 16px;
      height: 16px;
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-radius: 50%;
      border-top-color: white;
      animation: spin 1s ease-in-out infinite;
      margin-right: 8px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    @media (max-width: 480px) {
      .container {
        padding: 32px 24px;
        margin: 20px;
      }

      h1 {
        font-size: 28px;
      }

      .buttons {
        gap: 12px;
      }

      button {
        padding: 14px 20px;
        font-size: 15px;
      }
    }
  </style>
</head>
<body>
  <!-- Particules -->
  <div class="container">
    <div class="logo">
      <i class="fas fa-stopwatch"></i>
    </div>
    <h1>Chronotrail<br /><span>Gestion de Course</span></h1>
    <div class="input-group">
      <label for="idcourse">ID de la course</label>
      <div class="input-wrapper">
        <i class="fas fa-hashtag input-icon"></i>
        <input type="number" id="idcourse" placeholder="Saisissez l’ID course…" />
      </div>
    </div>
    <div class="buttons">
      <button class="btn-start" onclick="lancerCourse()">
        <i class="fas fa-play" style="margin-right: 8px;"></i>Lancer la course
      </button>
      <button class="btn-stop" onclick="terminerCourse()">
        <i class="fas fa-stop" style="margin-right: 8px;"></i>Terminer la course
      </button>
    </div>
    <div id="message"></div>
  </div>
  <script>
    function showMessage(text, type) {
      const messageEl = document.getElementById("message");
      messageEl.className = `show ${type}`;
      messageEl.innerHTML = text;
      setTimeout(() => {
        messageEl.classList.remove("show");
      }, 5000);
    }
    function showLoading(buttonEl) {
      const originalText = buttonEl.innerHTML;
      buttonEl.innerHTML = '<span class="loading"></span>Chargement…';
      buttonEl.disabled = true;
      return () => {
        buttonEl.innerHTML = originalText;
        buttonEl.disabled = false;
      };
    }
    async function lancerCourse() {
      const idcourse = document.getElementById("idcourse").value;
      if (!idcourse) {
        showMessage('<i class="fas fa-exclamation-triangle" style="margin-right: 8px;"></i>Veuillez saisir un ID de course', "error");
        return;
      }
      const buttonEl = document.querySelector(".btn-start");
      const resetButton = showLoading(buttonEl);
      try {
        const response = await fetch("/api/lancer-course", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ idcourse }),
        });
        const data = await response.json();
        if (response.ok) {
          showMessage(`<i class="fas fa-check-circle" style="margin-right: 8px;"></i>${data.message || "Course lancée avec succès !"}`, "success");
        } else {
          showMessage(`<i class="fas fa-exclamation-circle" style="margin-right: 8px;"></i>${data.error || "Erreur lors du lancement"}`, "error");
        }
      } catch (error) {
        showMessage('<i class="fas fa-exclamation-circle" style="margin-right: 8px;"></i>Erreur de connexion', "error");
      } finally {
        resetButton();
      }
    }
    async function terminerCourse() {
      const idcourse = document.getElementById("idcourse").value;
      if (!idcourse) {
        showMessage('<i class="fas fa-exclamation-triangle" style="margin-right: 8px;"></i>Veuillez saisir un ID de course', "error");
        return;
      }
      const buttonEl = document.querySelector(".btn-stop");
      const resetButton = showLoading(buttonEl);
      try {
        const response = await fetch("/api/terminer-course", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ idcourse }),
        });
        const data = await response.json();
        if (response.ok) {
          showMessage(`<i class="fas fa-check-circle" style="margin-right: 8px;"></i>${data.message || "Course terminée avec succès !"}`, "success");
        } else {
          showMessage(`<i class="fas fa-exclamation-circle" style="margin-right: 8px;"></i>${data.error || "Erreur lors de l’arrêt"}`, "error");
        }
      } catch (error) {
        showMessage('<i class="fas fa-exclamation-circle" style="margin-right: 8px;"></i>Erreur de connexion', "error");
      } finally {
        resetButton();
      }
    }
    document.addEventListener("DOMContentLoaded", () => {
      document.getElementById("idcourse").focus();
    });
    document.getElementById("idcourse").addEventListener("input", (e) => {
      if (e.target.value && document.getElementById("message").classList.contains("show")) {
        document.getElementById("message").classList.remove("show");
      }
    });
    document.getElementById("idcourse").addEventListener("keypress", (e) => {
      if (e.key === "Enter") lancerCourse();
    });
  </script>
</body>
</html>
