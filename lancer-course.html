<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chronotrail – Gestion de Course</title>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
    
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      position: relative;
      overflow-x: hidden;
    }

    /* Animated background particles */
    body::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><circle cx="20" cy="20" r="2" fill="rgba(255,255,255,0.1)"/><circle cx="80" cy="40" r="1.5" fill="rgba(255,255,255,0.15)"/><circle cx="40" cy="80" r="1" fill="rgba(255,255,255,0.1)"/><circle cx="90" cy="90" r="2.5" fill="rgba(255,255,255,0.05)"/><circle cx="10" cy="60" r="1.8" fill="rgba(255,255,255,0.12)"/></svg>') repeat;
      animation: float 20s infinite linear;
      pointer-events: none;
    }

    @keyframes float {
      0% { transform: translateY(0px) rotate(0deg); }
      100% { transform: translateY(-100px) rotate(360deg); }
    }

    .container {
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 24px;
      padding: 50px 40px;
      box-shadow: 
        0 8px 32px rgba(0, 0, 0, 0.1),
        inset 0 1px 0 rgba(255, 255, 255, 0.2);
      max-width: 500px;
      width: 100%;
      text-align: center;
      position: relative;
      transform: translateY(0);
      animation: slideIn 0.8s ease-out;
    }

    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .logo {
      width: 80px;
      height: 80px;
      background: linear-gradient(135deg, #ff6b6b, #ffd93d);
      border-radius: 50%;
      margin: 0 auto 30px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      color: white;
      box-shadow: 0 10px 30px rgba(255, 107, 107, 0.3);
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1);  }
      50% { transform: scale(1.05); }
    }

    h1 {
      color: white;
      font-size: 28px;
      font-weight: 700;
      margin-bottom: 40px;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.2);
      line-height: 1.2;
    }

    .input-group {
      margin-bottom: 40px;
      position: relative;
    }

    label {
      display: block;
      color: rgba(255, 255, 255, 0.9);
      font-weight: 500;
      margin-bottom: 12px;
      font-size: 16px;
      text-align: left;
    }

    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    .input-icon {
      position: absolute;
      left: 18px;
      color: rgba(255, 255, 255, 0.7);
      font-size: 18px;
      z-index: 2;
    }

    input[type="number"] {
      width: 100%;
      padding: 18px 18px 18px 55px;
      background: rgba(255, 255, 255, 0.1);
      border: 2px solid rgba(255, 255, 255, 0.2);
      border-radius: 16px;
      color: white;
      font-size: 18px;
      font-weight: 500;
      backdrop-filter: blur(10px);
      transition: all 0.3s ease;
      outline: none;
    }

    input[type="number"]::placeholder {
      color: rgba(255, 255, 255, 0.6);
    }

    input[type="number"]:focus {
      border-color: rgba(255, 255, 255, 0.5);
      background: rgba(255, 255, 255, 0.15);
      transform: translateY(-2px);
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
    }

    .buttons {
      display: flex;
      gap: 20px;
      margin-bottom: 30px;
      flex-wrap: wrap;
    }

    button {
      flex: 1;
      min-width: 180px;
      padding: 18px 30px;
      border: none;
      border-radius: 16px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      position: relative;
      overflow: hidden;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    button::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
      transition: left 0.5s;
    }

    button:hover::before {
      left: 100%;
    }

    .btn-start {
      background: linear-gradient(135deg, #00c851, #00a041);
      color: white;
      box-shadow: 0 8px 25px rgba(0, 200, 81, 0.3);
    }

    .btn-start:hover {
      transform: translateY(-3px);
      box-shadow: 0 12px 35px rgba(0, 200, 81, 0.4);
      background: linear-gradient(135deg, #00d558, #00b048);
    }

    .btn-start:active {
      transform: translateY(-1px);
    }

    .btn-stop {
      background: linear-gradient(135deg, #ff4757, #ff3742);
      color: white;
      box-shadow: 0 8px 25px rgba(255, 71, 87, 0.3);
    }

    .btn-stop:hover {
      transform: translateY(-3px);
      box-shadow: 0 12px 35px rgba(255, 71, 87, 0.4);
      background: linear-gradient(135deg, #ff5767, #ff4252);
    }

    .btn-stop:active {
      transform: translateY(-1px);
    }

    #message {
      min-height: 60px;
      padding: 20px;
      border-radius: 16px;
      font-weight: 500;
      font-size: 16px;
      transition: all 0.3s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transform: translateY(10px);
    }

    #message.show {
      opacity: 1;
      transform: translateY(0);
    }

    #message.success {
      background: rgba(0, 200, 81, 0.15);
      border: 1px solid rgba(0, 200, 81, 0.3);
      color: #00c851;
    }

    #message.error {
      background: rgba(255, 71, 87, 0.15);
      border: 1px solid rgba(255, 71, 87, 0.3);
      color: #ff4757;
    }

    .loading {
      display: inline-block;
      width: 20px;
      height: 20px;
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-radius: 50%;
      border-top-color: white;
      animation: spin 1s ease-in-out infinite;
      margin-right: 10px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Responsive design */
    @media (max-width: 600px) {
      .container {
        padding: 30px 25px;
        margin: 10px;
      }
      
      h1 {
        font-size: 24px;
      }
      
      .buttons {
        flex-direction: column;
      }
      
      button {
        min-width: unset;
      }
    }

    /* Subtle animations on load */
    .input-group {
      animation: fadeInUp 0.6s ease-out 0.2s both;
    }

    .buttons {
      animation: fadeInUp 0.6s ease-out 0.4s both;
    }

    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">
      <i class="fas fa-stopwatch"></i>
    </div>
    <h1>Chronotrail<br><span style="font-weight: 400; font-size: 18px; opacity: 0.8;">Gestion de Course</span></h1>
    
    <div class="input-group">
      <label for="idcourse">ID de la course</label>
      <div class="input-wrapper">
        <i class="fas fa-hashtag input-icon"></i>
        <input type="number" id="idcourse" placeholder="Saisissez l'ID..." />
      </div>
    </div>
    
    <div class="buttons">
      <button class="btn-start" onclick="lancerCourse()">
        <i class="fas fa-play" style="margin-right: 8px;"></i>
        Lancer la course
      </button>
      <button class="btn-stop" onclick="terminerCourse()">
        <i class="fas fa-stop" style="margin-right: 8px;"></i>
        Terminer la course
      </button>
    </div>
    
    <div id="message"></div>
  </div>

  <script>
    function showMessage(text, type) {
      const messageEl = document.getElementById("message");
      messageEl.className = `show ${type}`;
      messageEl.innerHTML = text;
      
      setTimeout(() => {
        messageEl.classList.remove('show');
      }, 5000);
    }

    function showLoading(buttonEl) {
      const originalText = buttonEl.innerHTML;
      buttonEl.innerHTML = '<span class="loading"></span>Chargement...';
      buttonEl.disabled = true;
      
      return () => {
        buttonEl.innerHTML = originalText;
        buttonEl.disabled = false;
      };
    }

    async function lancerCourse() {
      const idcourse = document.getElementById("idcourse").value;
      
      if (!idcourse) {
        showMessage('<i class="fas fa-exclamation-triangle" style="margin-right: 8px;"></i>Veuillez saisir un ID de course', 'error');
        return;
      }

      const buttonEl = document.querySelector('.btn-start');
      const resetButton = showLoading(buttonEl);
      
      try {
        const response = await fetch("/api/lancer-course", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ idcourse })
        });
        
        const data = await response.json();
        
        if (response.ok) {
          showMessage(`<i class="fas fa-check-circle" style="margin-right: 8px;"></i>${data.message || 'Course lancée avec succès !'}`, 'success');
        } else {
          showMessage(`<i class="fas fa-exclamation-circle" style="margin-right: 8px;"></i>${data.error || 'Erreur lors du lancement'}`, 'error');
        }
      } catch (error) {
        showMessage('<i class="fas fa-exclamation-circle" style="margin-right: 8px;"></i>Erreur de connexion', 'error');
      } finally {
        resetButton();
      }
    }

    async function terminerCourse() {
      const idcourse = document.getElementById("idcourse").value;
      
      if (!idcourse) {
        showMessage('<i class="fas fa-exclamation-triangle" style="margin-right: 8px;"></i>Veuillez saisir un ID de course', 'error');
        return;
      }

      const buttonEl = document.querySelector('.btn-stop');
      const resetButton = showLoading(buttonEl);
      
      try {
        const response = await fetch("/api/terminer-course", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ idcourse })
        });
        
        const data = await response.json();
        
        if (response.ok) {
          showMessage(`<i class="fas fa-check-circle" style="margin-right: 8px;"></i>${data.message || 'Course terminée avec succès !'}`, 'success');
        } else {
          showMessage(`<i class="fas fa-exclamation-circle" style="margin-right: 8px;"></i>${data.error || 'Erreur lors de l\'arrêt'}`, 'error');
        }
      } catch (error) {
        showMessage('<i class="fas fa-exclamation-circle" style="margin-right: 8px;"></i>Erreur de connexion', 'error');
      } finally {
        resetButton();
      }
    }

    // Auto-focus sur l'input au chargement
    document.addEventListener('DOMContentLoaded', () => {
      document.getElementById('idcourse').focus();
    });

    // Validation en temps réel
    document.getElementById('idcourse').addEventListener('input', (e) => {
      if (e.target.value && document.getElementById('message').classList.contains('show')) {
        document.getElementById('message').classList.remove('show');
      }
    });

    // Support du clavier (Entrée pour lancer)
    document.getElementById('idcourse').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') {
        lancerCourse();
      }
    });
  </script>
</body>
</html>
