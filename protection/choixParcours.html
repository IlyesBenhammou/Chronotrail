<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styleChoixParcours.css">
    <title>Choix du Parcours de Trail</title>
</head>
<body>
    <h1>Choisissez un Parcours de Trail</h1>

    <div id="loading-message">Chargement des parcours...</div>
    <div id="error-message" style="display: none;"></div>
    <div id="success-message" class="success-message"></div>

    <div id="parcours-container"></div>

    <!-- Boîte de dialogue de confirmation -->
    <div id="confirm-dialog" class="confirm-dialog">
        <div class="dialog-content">
            <h3>⚠️ Confirmation de suppression</h3>
            <p>Êtes-vous sûr de vouloir supprimer cette course ?</p>
            <p><strong>Cette action est irréversible.</strong></p>
            <div class="dialog-buttons">
                <button id="cancel-delete" class="dialog-btn cancel-btn">Annuler</button>
                <button id="confirm-delete" class="dialog-btn confirm-btn">Confirmer</button>
            </div>
        </div>
    </div>

    <section class="btn-container">
        <a class="btn-link" href="index.html">Accueil</a>
    </section>

    <script>
        
        let courseToDeleteId = null;
        let courseToDeleteName = null;
        function showDeleteConfirmation(id, name, event) {
            event.stopPropagation();
            courseToDeleteId = id;
            courseToDeleteName = name;
            
            // Mettre à jour le texte de confirmation avec le nom de la course
            const dialog = document.getElementById('confirm-dialog');
            const content = dialog.querySelector('.dialog-content p');
            content.innerHTML = `Êtes-vous sûr de vouloir supprimer la course <strong>"${name}"</strong> ?`;
            
            dialog.style.display = 'flex';
        }
        function closeDialog() {
            document.getElementById('confirm-dialog').style.display = 'none';
            courseToDeleteId = null;
            courseToDeleteName = null;
        }
        function showSuccessMessage(message) {
            const successDiv = document.getElementById('success-message');
            successDiv.textContent = message;
            successDiv.style.display = 'block';
            
            // Masquer le message après 3 secondes
            setTimeout(() => {
                successDiv.style.display = 'none';
            }, 3000);
        }
        async function deleteCourse(id) {
    try {
        console.log(`Tentative de suppression de la course avec ID: ${id}`);
        // Utiliser l'endpoint correct d'après votre serveur
        const response = await fetch(`/course/${id}`, {
            method: 'DELETE',
            headers: { 
                'Content-Type': 'application/json'
            }
        });
        console.log(`Réponse du serveur: ${response.status} ${response.statusText}`);

        if (!response.ok) {
            const errorText = await response.text();
            throw new Error(`Erreur ${response.status}: ${errorText}`);
        }


        const result = await response.json().catch(() => ({ message: 'Course supprimée' }));
        console.log("Course supprimée avec succès:", result);
        // Supprimer la carte de la course de l'interface avec animation
        const cardToRemove = document.querySelector(`[data-course-id="${id}"]`);
        if (cardToRemove) {
            cardToRemove.style.transition = 'opacity 0.3s, transform 0.3s';
            cardToRemove.style.opacity = '0';
            cardToRemove.style.transform = 'scale(0.8)';
            setTimeout(() => {
                cardToRemove.remove();
                // Vérifier s'il reste des courses
                const container = document.getElementById('parcours-container');
                if (container.children.length === 0) {
                    const errorMessage = document.getElementById('error-message');
                    errorMessage.innerText = "Aucun parcours disponible.";
                    errorMessage.style.display = 'block';
                }
            }, 300);
        }
        showSuccessMessage(`Course "${courseToDeleteName}" supprimée avec succès !`);
    } catch (error) {
        const errorDiv = document.getElementById('error-message');
        errorDiv.innerHTML = `
            <strong>Erreur lors de la suppression:</strong> ${error.message}<br>
            <small>Vérifiez que votre serveur est démarré et que l'endpoint /course/${id} est accessible.</small>
        `;
        errorDiv.style.display = 'block';
        
        // Masquer le message d'erreur après 5 secondes
        setTimeout(() => {
            errorDiv.style.display = 'none';
        }, 5000);
    }
}
        function redirectToTrail(id) {
            window.location.href = `detailTrail.html?id=${id}`;
        }

        // Event listeners pour la boîte de dialogue
        document.getElementById('cancel-delete').addEventListener('click', closeDialog);
        document.getElementById('confirm-delete').addEventListener('click', () => {
            if (courseToDeleteId) {
                deleteCourse(courseToDeleteId);
                closeDialog();
            }
        });

        // Fermer la boîte de dialogue en cliquant à l'extérieur
        document.getElementById('confirm-dialog').addEventListener('click', (e) => {
            if (e.target.id === 'confirm-dialog') {
                closeDialog();
            }
        });

        // Charger les parcours
        async function loadCourses() {
            try {
                const response = await fetch('/courses');
                
                if (!response.ok) {
                    throw new Error(`Erreur HTTP: ${response.status} - ${response.statusText}`);
                }
                
                const courses = await response.json();
                document.getElementById('loading-message').style.display = 'none';
                const container = document.getElementById('parcours-container');

                if (!courses || courses.length === 0) {
                    document.getElementById('error-message').innerText = "Aucun parcours disponible.";
                    document.getElementById('error-message').style.display = 'block';
                    return;
                }

                courses.forEach(course => {
                    const card = document.createElement('div');
                    card.className = 'parcours-card';
                    card.setAttribute('data-course-id', course.idcourse);
                    
                    // Éviter que le clic sur supprimer déclenche la redirection
                    card.addEventListener('click', (e) => {
                        if (!e.target.classList.contains('delete-btn')) {
                            redirectToTrail(course.idcourse);
                        }
                    });

                    const dateStr = course.datecourse ? 
                        new Date(course.datecourse).toLocaleString('fr-FR', {
                            year: 'numeric',
                            month: 'long',
                            day: 'numeric',
                            hour: '2-digit',
                            minute: '2-digit'
                        }) : 'Date non spécifiée';

                    const courseName = course.nomcourse || `Parcours #${course.idcourse}`;

                    card.innerHTML = `
                        <button class="delete-btn" onclick="showDeleteConfirmation(${course.idcourse}, '${courseName.replace(/'/g, "\\'")}', event)" title="Supprimer cette course">
                            ✕
                        </button>
                        <div class="parcours-content">
                            <h3>${courseName}</h3>
                            <p class="location">🏃‍♂️ Départ: ${course.heure_depart || 'Non spécifié'} → Arrivée: ${course.heure_arrivee || 'Non spécifié'}</p>
                            <p class="date">📅 ${dateStr}</p>
                            ${course.distance ? `<p class="distance">📏 Distance: ${course.distance} km</p>` : ''}
                            <p class="participants">👥 Max participants: ${course.nb_max_participants || 'Non spécifié'}</p>
                        </div>
                    `;

                    container.appendChild(card);
                });

            } catch (error) {
                console.error("Erreur lors du chargement des parcours:", error);
                document.getElementById('loading-message').style.display = 'none';
                const err = document.getElementById('error-message');
                err.innerHTML = `
                    <strong>Erreur:</strong> ${error.message}<br>
                    <small>Vérifiez que votre serveur est démarré et accessible.</small>
                `;
                err.style.display = 'block';
            }
        }

        // Charger les parcours au démarrage
        loadCourses();
    </script>
</body>
</html>
