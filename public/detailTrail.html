<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" type="text/css" href="styleDetailTrail.css">
  <title>Détail Trail</title>
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.7.1/dist/leaflet.css"
  />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body>
  <div class="container">
    <div id="loading-message">Chargement du parcours...</div>
    <div id="error-message" class="error" style="display:none;"></div>

    <h1 id="trail-title" style="display:none;"></h1>

    <!-- Image de la course -->
    <div id="course-image-container" class="image-container" style="display:none;">
      <img id="course-image" class="course-image" alt="Photo de la course" />
      <div class="image-caption">Photo de la course</div>
    </div>

    <div id="course-details" style="display:none;"></div>

    <div id="map"></div>

    <div id="ranking-section" style="display:none;">
      <h2>Classement</h2>
      <div id="classement-test"></div>
      <button id="download-pdf" class="download-pdf" style="margin-top: 20px;">Télécharger le classement en PDF</button>

    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.7.1/dist/leaflet.js"></script>
  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const courseId = urlParams.get('id') || 1;

    // Initialisation de la carte Leaflet
    const map = L.map('map').setView([46.603354, 1.888334], 6);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '&copy; OpenStreetMap contributors',
    }).addTo(map);

    // Formate une date (ex: "4 juin 2025 09:20")
    function formatDate(dateString) {
      if (!dateString) return 'Non spécifiée';
      const date = new Date(dateString);
      return date.toLocaleDateString('fr-FR', {
        day: 'numeric',
        month: 'long',
        year: 'numeric',
        hour: '2-digit',
        minute: '2-digit',
      });
    }

    // Formate une heure (ex: "09:20:47")
    function formatTime(timeString) {
      if (!timeString || timeString === null || timeString === 'null') return 'Non spécifié';
      const date = new Date(timeString);
      if (isNaN(date.getTime())) return 'Non spécifié';
      return date.toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
    }

    // Formate une durée en secondes en hh:mm:ss
    function formatDuration(seconds) {
      if (!seconds || seconds <= 0) return 'Non spécifié';
      const h = Math.floor(seconds / 3600);
      const m = Math.floor((seconds % 3600) / 60);
      const s = Math.floor(seconds % 60);
      return (h > 0 ? h.toString().padStart(2, '0') + ':' : '') +
             m.toString().padStart(2, '0') + ':' +
             s.toString().padStart(2, '0');
    }

    // Traite les coordonnées (pour la carte)
    function processCoordinates(data) {
      try {
        const coords = typeof data === 'string' ? JSON.parse(data) : data;
        if (!Array.isArray(coords)) return [];
        if (coords.length > 0 && Array.isArray(coords[0][0])) {
          return coords.flat();
        }
        return coords.filter(c => Array.isArray(c) && c.length === 2);
      } catch (e) {
        console.error('Erreur lors du traitement des coordonnées:', e);
        return [];
      }
    }

    // Fonction pour chercher dynamiquement une image de course
    function findCourseImage(courseId) {
      // Essayer différents patterns d'images de course
      const possibleImages = [
        `/photo-capture/course_${courseId}.jpg`,
        `/photo-capture/photo_${courseId}_course.jpg`,
        `/photo-capture/course_image_${courseId}.jpg`
      ];

      return new Promise((resolve) => {
        let imageFound = false;
        let checkedImages = 0;

        possibleImages.forEach(imagePath => {
          const img = new Image();
          img.onload = () => {
            if (!imageFound) {
              imageFound = true;
              resolve(imagePath);
            }
          };
          img.onerror = () => {
            checkedImages++;
            if (checkedImages === possibleImages.length && !imageFound) {
              resolve(null);
            }
          };
          img.src = imagePath;
        });
      });
    }

    // Affiche l'image de la course si elle existe
    async function displayCourseImage(courseId) {
      const imageContainer = document.getElementById('course-image-container');
      const courseImage = document.getElementById('course-image');

      const imagePath = await findCourseImage(courseId);
      
      if (imagePath) {
        courseImage.src = imagePath;
        imageContainer.style.display = 'block';
      } else {
        console.warn(`Aucune image de course trouvée pour la course ${courseId}`);
      }
    }

    let course = null;  // variable globale accessible partout

fetch(`/course/${courseId}`)
  .then(res => {
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    return res.json();
  })
  .then(data => {
    course = data; // stocke les données globalement

    document.getElementById('loading-message').style.display = 'none';

    // Titre de la course
    const title = document.getElementById('trail-title');
    title.textContent = course.nomcourse || `Course #${course.idcourse}`;
    title.style.display = 'block';

    // Afficher image de la course
    displayCourseImage(course.idcourse);

    // Afficher détails de la course
    const details = document.getElementById('course-details');
    details.innerHTML = `
      <strong>📅 Date :</strong> ${formatDate(course.datecourse)}<br>
      <strong>🏃 Heure de départ :</strong> ${course.heure_depart || 'Non spécifié'}<br>
      <strong>🏁 Heure d'arrivée :</strong> ${course.heure_arrivee || 'Non spécifié'}<br>
      <strong>📏 Distance :</strong> ${course.distance ? course.distance + ' km' : 'Non spécifiée'}<br>
      <strong>👥 Participants Max :</strong> ${course.nb_max_participants || 'Non spécifié'}
    `;
    details.style.display = 'block';

    // Afficher parcours sur la carte
    const coords = processCoordinates(course.coordonnees);
    if (coords.length > 0) {
      const polyline = L.polyline(coords, { color: '#28a745', weight: 4 }).addTo(map);
      L.marker(coords[0]).addTo(map).bindPopup('🏃 Départ');
      L.marker(coords[coords.length - 1]).addTo(map).bindPopup('🏁 Arrivée');
      map.fitBounds(polyline.getBounds());
    } else {
      map.setView([46.603354, 1.888334], 6);
    }

    // Afficher classement des coureurs
    const classementContainer = document.getElementById('classement-test');
    classementContainer.innerHTML = '';

    if (Array.isArray(course.classement) && course.classement.length > 0) {
      course.classement.forEach(coureur => {
        const div = document.createElement('div');
        div.className = 'runner-card';

        let photoHtml = '';
        if (coureur.photo) {
          photoHtml = `
            <div>
              <img src="/photo-capture/${coureur.photo}" alt="Photo de ${coureur.prenomcoureur} ${coureur.nomcoureur}" class="runner-photo" />
              <div class="photo-info">${coureur.photo}</div>
            </div>
          `;
        } else {
          photoHtml = `<div style="width:100px; height:100px; background:#ddd; border-radius:8px; display:flex; align-items:center; justify-content:center; color:#999; font-size:0.8em;">Pas de photo</div>`;
        }

        div.innerHTML = `
          ${photoHtml}
          <div class="runner-info">
            <div class="runner-name">
              <strong>${coureur.classement ?? 'N/A'}.</strong> ${coureur.prenomcoureur} ${coureur.nomcoureur}
            </div>
            <div class="runner-times">
              <div class="time-info">
                <div class="time-label">Départ</div>
                <div class="time-value">${formatTime(coureur.heure_depart)}</div>
              </div>
              <div class="time-info">
                <div class="time-label">Arrivée</div>
                <div class="time-value">${formatTime(coureur.heure_arrivee)}</div>
              </div>
              <div class="time-info">
                <div class="time-label">Temps total</div>
                <div class="time-value">${formatDuration(coureur.temps_total_secondes)}</div>
              </div>
            </div>
          </div>
        `;

        classementContainer.appendChild(div);
      });
    } else {
      classementContainer.innerHTML = `<div class="no-runners">Aucun coureur inscrit pour cette course.</div>`;
    }

    document.getElementById('ranking-section').style.display = 'block';
  })
  .catch(err => {
    console.error('Erreur fetch:', err);
    document.getElementById('loading-message').style.display = 'none';
    const errorMsg = document.getElementById('error-message');
    errorMsg.textContent = `Erreur : ${err.message}`;
    errorMsg.style.display = 'block';
  });

  // Ajouter les événements de clic sur les photos
document.addEventListener('DOMContentLoaded', function() {
  // Créer le modal une seule fois
  const modal = document.createElement('div');
  modal.className = 'photo-modal';
  modal.innerHTML = `
    <div class="photo-modal-content">
      <span class="photo-modal-close">&times;</span>
      <img src="" alt="Photo agrandie">
    </div>
  `;
  document.body.appendChild(modal);
  
  const modalImg = modal.querySelector('img');
  const closeBtn = modal.querySelector('.photo-modal-close');
  
  // Gérer les clics sur les photos
  document.addEventListener('click', function(e) {
    if (e.target.classList.contains('runner-photo')) {
      modalImg.src = e.target.src;
      modal.classList.add('show');
    }
  });
  
  // Fermer le modal
  closeBtn.addEventListener('click', () => modal.classList.remove('show'));
  modal.addEventListener('click', (e) => {
    if (e.target === modal) modal.classList.remove('show');
  });
});

// Gestion du bouton Télécharger en PDF
document.getElementById('download-pdf').addEventListener('click', () => {
  if (!course) {
    alert("Les données ne sont pas encore chargées.");
    return;
  }

  const { jsPDF } = window.jspdf;
  const doc = new jsPDF();

  let y = 10;
  doc.setFontSize(14);
  doc.text("Classement des coureurs", 10, y);
  y += 10;

  if (Array.isArray(course.classement) && course.classement.length > 0) {
    course.classement.forEach((coureur) => {
      const ligne = `${coureur.classement ?? 'N/A'}. ${coureur.prenomcoureur} ${coureur.nomcoureur} - Départ: ${formatTime(coureur.heure_depart)} - Arrivée: ${formatTime(coureur.heure_arrivee)} - Temps: ${formatDuration(coureur.temps_total_secondes)}`;
      doc.setFontSize(11);
      doc.text(ligne, 10, y);
      y += 8;

      if (y > 280) {
        doc.addPage();
        y = 10;
      }
    });

    doc.save("classement.pdf");
  } else {
    alert("Aucun coureur à exporter.");
  }
});


  </script>
</body>
</html>
