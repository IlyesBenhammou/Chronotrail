<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <title>Connexion Admin – ChronoTrail</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f1f5f9;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
    }
    .container {
      background: #fff;
      padding: 2rem;
      border-radius: 0.5rem;
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
      width: 320px;
      text-align: center;
    }
    h1 {
      margin-bottom: 1.5rem;
      font-size: 1.25rem;
      color: #2563eb;
    }
    .form-group {
      margin-bottom: 1rem;
      text-align: left;
    }
    label {
      display: block;
      margin-bottom: 0.25rem;
      font-weight: bold;
      font-size: 0.9rem;
      color: #334155;
    }
    input[type="text"],
    input[type="password"] {
      width: 100%;
      padding: 0.5rem;
      border: 1px solid #cbd5e1;
      border-radius: 0.375rem;
      font-size: 1rem;
      color: #1e293b;
    }
    input[type="text"]:focus,
    input[type="password"]:focus {
      outline: none;
      border-color: #2563eb;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.2);
    }
    button {
      width: 100%;
      padding: 0.5rem;
      background: #2563eb;
      color: #fff;
      border: none;
      border-radius: 0.375rem;
      font-size: 1rem;
      cursor: pointer;
      margin-top: 0.5rem;
    }
    button:disabled {
      background: #94a3b8;
      cursor: not-allowed;
    }
    .error {
      color: #dc2626;
      font-size: 0.875rem;
      min-height: 1.2rem;
      margin-top: 0.5rem;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>Connexion Admin</h1>
    <form id="loginForm">
      <div class="form-group">
        <label for="username">Identifiant :</label>
        <input type="text" id="username" autocomplete="off" required maxlength="50" />
      </div>
      <div class="form-group">
        <label for="password">Mot de passe :</label>
        <input type="password" id="password" autocomplete="new-password" required maxlength="50" />
      </div>
      <button type="submit" id="btnLogin" disabled>Se connecter</button>
      <div class="error" id="errorMsg"></div>
    </form>
  </div>

  <script>
    // Identifiant et mot de passe "hardcodés"
    const VALID_USER = 'admin';
    const VALID_PASS = 'ChronoTrail@123';

    const form = document.getElementById('loginForm');
    const btnLogin = document.getElementById('btnLogin');
    const errorMsg = document.getElementById('errorMsg');
    const inputUser = document.getElementById('username');
    const inputPass = document.getElementById('password');

    // Active/désactive le bouton en fonction de la présence de texte dans les deux champs
    function toggleButton() {
      const u = inputUser.value.trim();
      const p = inputPass.value;
      btnLogin.disabled = !(u && p);
    }
    inputUser.addEventListener('input', toggleButton);
    inputPass.addEventListener('input', toggleButton);

    form.addEventListener('submit', function(evt) {
      evt.preventDefault();
      // Récupère et nettoie les valeurs
      const username = inputUser.value.trim();
      const password = inputPass.value;

      // Vérification simple
      if (username === VALID_USER && password === VALID_PASS) {
        // Réinitialise le message d'erreur s'il y en avait un
        errorMsg.textContent = '';
        // Redirection vers Gestions_des_coureurs.html
        window.location.href = 'Gestion_des_coureurs.html';
      } else {
        errorMsg.textContent = 'Identifiant ou mot de passe incorrect.';
      }
    });
  </script>

</body>
</html>
