<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" type="text/css" href="style_con.css">
    <title>Mot de Passe Oublié</title>
</head>
<body>
    <div class="container">
        <h1>Mot de Passe Oublié</h1>
        <form action="/envoyer-email" method="POST">
            <section class="input-box">
                <input type="text" id="username" name="username" placeholder="Identifiant" required>
                <i class="bx bxs-lock-user"> </i>
            </section>
            <section class="input-box">
                <input type="email" name="email" placeholder="Entrez votre email" required>
            </section>
            
            <button class="login-button" type="submit">Envoyer Email de Réinitialisation</button>
        </form>
    </div>
</body>
</html>
