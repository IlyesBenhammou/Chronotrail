<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chronotrail – Gestion de Course</title>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet" />
  <style>
    /* Reset et base */
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: "Segoe UI", sans-serif;
}

body {
  height: 100vh;
  background: linear-gradient(135deg, #2c3e50, #4ca1af);
  display: flex;
  justify-content: center;
  align-items: center;
  color: #fff;
}

.container {
  background: rgba(0, 0, 0, 0.3);
  padding: 2rem 3rem;
  border-radius: 20px;
  box-shadow: 0 0 20px rgba(0, 0, 0, 0.3);
  width: 100%;
  max-width: 500px;
  text-align: center;
  animation: fadeIn 0.8s ease;
}

/* Logo */
.logo {
  font-size: 3rem;
  margin-bottom: 1rem;
  color: #fff;
}

/* Titre principal */
h1 {
  font-size: 2rem;
  margin-bottom: 0.5rem;
}
h1 span {
  font-size: 1.2rem;
  color: #ddd;
}

/* Groupe d'entrée */
.input-group {
  margin: 2rem 0 1.5rem;
  text-align: left;
}

.input-group label {
  font-weight: bold;
  display: block;
  margin-bottom: 0.5rem;
}

.input-wrapper {
  position: relative;
}

.input-wrapper .input-icon {
  position: absolute;
  top: 50%;
  left: 10px;
  transform: translateY(-50%);
  color: #aaa;
}

.input-wrapper input {
  width: 100%;
  padding: 10px 10px 10px 35px;
  border: none;
  border-radius: 8px;
  background: #f7f7f7;
  color: #333;
  font-size: 1rem;
  transition: box-shadow 0.3s ease;
}

.input-wrapper input:focus {
  outline: none;
  box-shadow: 0 0 5px #00c3ff;
}

/* Boutons */
.buttons {
  display: flex;
  justify-content: space-between;
  margin-top: 1.5rem;
  gap: 1rem;
}

button {
  flex: 1;
  padding: 12px 0;
  border: none;
  border-radius: 10px;
  font-weight: bold;
  font-size: 1rem;
  color: white;
  cursor: pointer;
  transition: transform 0.2s ease, background 0.3s;
  display: flex;
  justify-content: center;
  align-items: center;
}

button i {
  font-size: 1rem;
}

/* Start button */
.btn-start {
  background: #27ae60;
}
.btn-start:hover {
  background: #2ecc71;
  transform: scale(1.03);
}

/* Stop button */
.btn-stop {
  background: #c0392b;
}
.btn-stop:hover {
  background: #e74c3c;
  transform: scale(1.03);
}

/* Loading animation */
.loading {
  display: inline-block;
  width: 16px;
  height: 16px;
  border: 3px solid #fff;
  border-top: 3px solid transparent;
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
  margin-right: 8px;
}

/* Message display */
#message {
  margin-top: 1.5rem;
  padding: 10px 15px;
  border-radius: 10px;
  display: none;
  font-weight: bold;
  animation: fadeIn 0.5s ease;
}

#message.show {
  display: block;
}

.success {
  background-color: rgba(46, 204, 113, 0.2);
  border: 1px solid #2ecc71;
  color: #2ecc71;
}

.error {
  background-color: rgba(231, 76, 60, 0.2);
  border: 1px solid #e74c3c;
  color: #e74c3c;
}

/* Animations */
@keyframes fadeIn {
  from { opacity: 0; transform: translateY(-10px); }
  to { opacity: 1; transform: translateY(0); }
}

@keyframes spin {
  to {
    transform: rotate(360deg);
  }
}

  </style>
</head>
<body>
  <div class="container">
    <div class="logo">
      <i class="fas fa-stopwatch"></i>
    </div>
    <h1>Chronotrail<br /><span>Gestion de Course</span></h1>
    <div class="input-group">
      <label for="idcourse">ID de la course</label>
      <div class="input-wrapper">
        <i class="fas fa-hashtag input-icon"></i>
        <input type="number" id="idcourse" placeholder="Saisissez l'ID course…" />
      </div>
    </div>
    <div class="buttons">
      <button class="btn-start" onclick="lancerCourse()">
        <i class="fas fa-play" style="margin-right: 8px;"></i>Lancer la course
      </button>
      <button class="btn-stop" onclick="terminerCourse()">
        <i class="fas fa-stop" style="margin-right: 8px;"></i>Terminer la course
      </button>
    </div>
    <div id="message"></div>
  </div>
  <script>
    function showMessage(text, type) {
      const messageEl = document.getElementById("message");
      messageEl.className = `show ${type}`;
      messageEl.innerHTML = text;
      setTimeout(() => {
        messageEl.classList.remove("show");
      }, 5000);
    }
    function showLoading(buttonEl) {
      const originalText = buttonEl.innerHTML;
      buttonEl.innerHTML = '<span class="loading"></span>Chargement…';
      buttonEl.disabled = true;
      return () => {
        buttonEl.innerHTML = originalText;
        buttonEl.disabled = false;
      };
    }
    async function lancerCourse() {
      const idcourse = document.getElementById("idcourse").value;
      if (!idcourse) {
        showMessage('<i class="fas fa-exclamation-triangle" style="margin-right: 8px;"></i>Veuillez saisir un ID de course', "error");
        return;
      }
      const buttonEl = document.querySelector(".btn-start");
      const resetButton = showLoading(buttonEl);
      try {
        const response = await fetch("/api/lancer-course", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ idcourse }),
        });
        const data = await response.json();
        if (response.ok) {
          showMessage(`<i class="fas fa-check-circle" style="margin-right: 8px;"></i>${data.message || "Course lancée avec succès !"}`, "success");
        } else {
          showMessage(`<i class="fas fa-exclamation-circle" style="margin-right: 8px;"></i>${data.error || "Erreur lors du lancement"}`, "error");
        }
      } catch (error) {
        showMessage('<i class="fas fa-exclamation-circle" style="margin-right: 8px;"></i>Erreur de connexion', "error");
      } finally {
        resetButton();
      }
    }
    async function terminerCourse() {
      const idcourse = document.getElementById("idcourse").value;
      if (!idcourse) {
        showMessage('<i class="fas fa-exclamation-triangle" style="margin-right: 8px;"></i>Veuillez saisir un ID de course', "error");
        return;
      }
      const buttonEl = document.querySelector(".btn-stop");
      const resetButton = showLoading(buttonEl);
      try {
        const response = await fetch("/api/terminer-course", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ idcourse }),
        });
        const data = await response.json();
        if (response.ok) {
          showMessage(`<i class="fas fa-check-circle" style="margin-right: 8px;"></i>${data.message || "Course terminée avec succès !"}`, "success");
        } else {
          showMessage(`<i class="fas fa-exclamation-circle" style="margin-right: 8px;"></i>${data.error || "Erreur lors de l'arrêt"}`, "error");
        }
      } catch (error) {
        showMessage('<i class="fas fa-exclamation-circle" style="margin-right: 8px;"></i>Erreur de connexion', "error");
      } finally {
        resetButton();
      }
    }
    document.addEventListener("DOMContentLoaded", () => {
      document.getElementById("idcourse").focus();
    });
    document.getElementById("idcourse").addEventListener("input", (e) => {
      if (e.target.value && document.getElementById("message").classList.contains("show")) {
        document.getElementById("message").classList.remove("show");
      }
    });
    document.getElementById("idcourse").addEventListener("keypress", (e) => {
      if (e.key === "Enter") lancerCourse();
    });
  </script>
</body>
</html>
