<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Réinitialisation du Mot de Passe</title>
    <style>
        * {
            font-family: "Poppins", sans-serif;
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100%;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #222;
            color: white;
        }

        .container {
            background: rgba(0, 0, 0, 0.7);
            width: 320px;
            padding: 24px;
            border-radius: 16px;
            border: 2px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0px 0px 40px 20px rgba(0, 0, 0, 0.3);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            margin-bottom: 16px;
            font-size: 24px;
            font-weight: bold;
            color: white;
        }

        .input-box {
            display: flex;
            width: 100%;
            position: relative;
            margin-top: 20px;
        }

        .input-box input {
            padding: 12px 16px 12px 38px;
            border-radius: 50px;
            border: solid 2px transparent;
            background: rgba(255, 255, 255, 0.2);
            outline: none;
            caret-color: white;
            font-weight: 500;
            color: white;
            width: 100%;
        }

        .input-box input:focus {
            border: solid 2px rgba(255, 255, 255, 0.5);
        }

        .input-box input::placeholder {
            color: rgba(255, 255, 255, 0.9);
        }

        .login-button {
            padding: 12px 24px;
            border-radius: 50px;
            border: none;
            background-color: #9b4de8;
            color: white;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            margin-top: 20px;
            width: 100%;
            transition: background-color 0.3s ease, transform 0.3s ease;
        }

        .login-button:hover {
            background-color: #8a3dde;
            transform: scale(1.05);
        }

        .login-button:active {
            background-color: #6f2ac4;
        }

        #responseMessage {
            margin-top: 20px;
            font-size: 14px;
            color: #9b4de8;
            text-align: center;
        }
    
    </style>
</head>
<body>
    <div class="container">
        <h1>Réinitialisez votre mot de passe</h1>
        
        <!-- Formulaire pour entrer le nouveau mot de passe -->
        <form id="resetPasswordForm" action="/reset-password-submit" method="POST">
             <!-- Champs cachés pour transmettre les informations du token et email -->
              <input type="hidden" id="token" name="token" value="">
              <input type="hidden" id="email" name="email" value="">

            <section class="input-box">
                <input type="text" id="username" name="username" placeholder="Identifiant" required>
            </section>
            <section class="input-box">
                <input type="password" id="newPassword" name="newPassword" placeholder="Nouveau mot de passe" required>
            </section>
            <section class="input-box">
                <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Confirmez le mot de passe" required>
            </section>
            <button class="login-button" type="submit">Réinitialiser le mot de passe</button>
        </form>
        
        <div id="responseMessage"></div> <!-- Message de confirmation ou erreur -->

    </div>

    <script>
    document.getElementById('resetPasswordForm').addEventListener('submit', function(e) {
    e.preventDefault(); // Empêche le rechargement de la page

    var username = document.getElementById('username').value; // Identifiant
    var newPassword = document.getElementById('newPassword').value; // Nouveau mot de passe
    var confirmPassword = document.getElementById('confirmPassword').value; // Confirmation

    window.onload = function() {
    // Récupère les paramètres de l'URL
    const urlParams = new URLSearchParams(window.location.search);
    const token = urlParams.get('token');
    const email = urlParams.get('email');

    // Remplit les champs cachés avec les valeurs du token et de l'email
    if (token && email) {
        document.getElementById('token').value = token;
        document.getElementById('email').value = email;
    } else {
        // Gérer le cas où le token ou l'email est manquant
        document.getElementById('responseMessage').innerText = "Lien invalide ou expiré.";
    }
};


    if (newPassword !== confirmPassword) {
        document.getElementById('responseMessage').innerHTML = "<p>Les mots de passe ne correspondent pas.</p>";
        return;
    }
});
 </script>
</body>
</html>
