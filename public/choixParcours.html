<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" type="text/css" href="styleGestionJourneCoureur.css">
    <title>Choix du Parcours de Trail</title>
</head>
<body>
    <h1>Choisissez un Parcours de Trail</h1>
    
    <div id="loading-message" class="loading">Chargement des parcours...</div>
    <div id="error-message" class="error" style="display: none;"></div>
    
    <div id="parcours-container">
        <!-- Les parcours seront chargés dynamiquement ici -->
    </div>
    
    <script>
        // Charger tous les parcours depuis l'API
        fetch('/courses')
            .then(response => {
                if (!response.ok) {
                    throw new Error(`Erreur HTTP: ${response.status}`);
                }
                return response.json();
            })
            .then(courses => {
                const container = document.getElementById('parcours-container');
                document.getElementById('loading-message').style.display = 'none';
                
                if (!courses || courses.length === 0) {
                    document.getElementById('error-message').innerText = "Aucun parcours disponible.";
                    document.getElementById('error-message').style.display = 'block';
                    return;
                }
                
                // Créer une carte pour chaque parcours
                courses.forEach(course => {
                    const card = document.createElement('div');
                    card.className = 'parcours-card';
                    card.onclick = () => redirectToTrail(course.idcourse);
                    
                    // Formatage de la date
                    let dateStr = '';
                    if (course.datecourse) {
                        try {
                            // Essayer de formater la date
                            const date = new Date(course.datecourse);
                            dateStr = date.toLocaleDateString('fr-FR', {
                                day: '2-digit',
                                month: '2-digit',
                                year: 'numeric',
                                hour: '2-digit',
                                minute: '2-digit'
                            });
                        } catch (e) {
                            // Si le formatage échoue, afficher la date brute
                            dateStr = course.datecourse;
                        }
                    }
                    
                    // Créer le contenu HTML de la carte
                    card.innerHTML = `
                    <div class="parcours-content">
                        <h3>${course.nomcourse || `Parcours #${course.idcourse}`}</h3>
                        <p class="location">Départ: ${course.heure_depart || 'Non spécifié'} → Arrivée: ${course.heure_arrivee || 'Non spécifié'}</p>
                        <p class="date">${dateStr}</p>
                        <p class="distance">${course.distance ? `Distance: ${course.distance} km` : ''}</p>
                        <p class="participants">Max participants: ${course.nb_max_participants || 'Non spécifié'}</p>
                    </div>
                    `;
                    
                    container.appendChild(card);
                });
            })
            .catch(error => {
                console.error("Erreur lors du chargement des parcours:", error);
                document.getElementById('loading-message').style.display = 'none';
                document.getElementById('error-message').innerText = `Erreur: ${error.message}`;
                document.getElementById('error-message').style.display = 'block';
            });
        
        // Fonction pour rediriger vers la page de carte avec l'ID du parcours
        function redirectToTrail(id) {
            window.location.href = `detailTrail.html?id=${id}`;
        }
    </script>
</body>
</html>
