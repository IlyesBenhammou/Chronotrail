<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Choix du Parcours de Trail</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f5f5f5;
        }
        h1 {
            color: #2c3e50;
            text-align: center;
        }
        #parcours-container {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            margin-bottom: 30px;
            justify-content: center;
        }
        .parcours-card {
            background-color: white;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            padding: 15px;
            width: 250px;
            cursor: pointer;
            transition: transform 0.3s ease;
        }
        .parcours-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 6px 12px rgba(0,0,0,0.15);
        }
        .parcours-card h3 {
            margin-top: 0;
            color: #3498db;
        }
        .parcours-card p {
            color: #7f8c8d;
            margin: 5px 0;
        }
        .loading {
            text-align: center;
            padding: 20px;
            font-style: italic;
            color: #7f8c8d;
        }
        .error {
            background-color: #f8d7da;
            color: #721c24;
            padding: 10px;
            border-radius: 5px;
            margin: 10px 0;
            text-align: center;
        }
        .date {
            font-size: 0.9em;
            color: #95a5a6;
        }
        .distance {
            font-weight: bold;
            color: #2c3e50;
        }
        .location {
            display: flex;
            align-items: center;
            margin: 5px 0;
        }
        .location::before {
            content: "📍";
            margin-right: 5px;
        }
    </style>
</head>
<body>
    <h1>Choisissez un Parcours de Trail</h1>
    
    <div id="loading-message" class="loading">Chargement des parcours...</div>
    <div id="error-message" class="error" style="display: none;"></div>
    
    <div id="parcours-container">
        <!-- Les parcours seront chargés dynamiquement ici -->
    </div>
    
    <script>
        // Charger tous les parcours depuis l'API
        fetch('http://localhost:3000/courses')
            .then(response => {
                if (!response.ok) {
                    throw new Error(`Erreur HTTP: ${response.status}`);
                }
                return response.json();
            })
            .then(courses => {
                const container = document.getElementById('parcours-container');
                document.getElementById('loading-message').style.display = 'none';
                
                if (!courses || courses.length === 0) {
                    document.getElementById('error-message').innerText = "Aucun parcours disponible.";
                    document.getElementById('error-message').style.display = 'block';
                    return;
                }
                
                // Créer une carte pour chaque parcours
                courses.forEach(course => {
                    const card = document.createElement('div');
                    card.className = 'parcours-card';
                    card.onclick = () => redirectToTrail(course.id);
                    
                    // Formater la date si elle existe
                    let dateStr = '';
                    if (course.date) {
                        const date = new Date(course.date);
                        dateStr = date.toLocaleDateString('fr-FR', {
                            day: 'numeric',
                            month: 'long',
                            year: 'numeric'
                        });
                    }
                    
                    // Créer le contenu HTML de la carte
                    card.innerHTML = `
                        <h3>${course.nom || `Parcours #${course.id}`}</h3>
                        ${course.lieu ? `<p class="location">${course.lieu}</p>` : ''}
                        ${course.distance ? `<p class="distance">${course.distance} km</p>` : ''}
                        ${dateStr ? `<p class="date">${dateStr}</p>` : ''}
                        ${course.description ? `<p>${course.description.substring(0, 50)}${course.description.length > 50 ? '...' : ''}</p>` : ''}
                    `;
                    
                    container.appendChild(card);
                });
            })
            .catch(error => {
                console.error("Erreur lors du chargement des parcours:", error);
                document.getElementById('loading-message').style.display = 'none';
                document.getElementById('error-message').innerText = `Erreur: ${error.message}`;
                document.getElementById('error-message').style.display = 'block';
            });
        
        // Fonction pour rediriger vers la page de carte avec l'ID du parcours
        function redirectToTrail(id) {
            window.location.href = `detailCourse.html?id=${id}`;
        }
    </script>
</body>
</html>
