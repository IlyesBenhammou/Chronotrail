
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" type="text/css" href="style_con.css">
    <title>Connexion</title>
</head>
<body>
    <form class="container" action="/login" method="POST">
        <div class="admin-badge">Admin</div>
        
        <h1>Administration</h1>
        <p class="subtitle">Accès sécurisé à l'espace administrateur</p>
        <div id="error-message" class="error-message"></div>

        
        <section class="input-box">
            <input type="text" id="username" name="username" placeholder="Identifiant administrateur" required>
            <i class="bx bxs-user"></i>
        </section>
        
        <section class="input-box">
            <input type="password" id="password" name="password" placeholder="Mot de passe" required>
            <i class="bx bxs-lock-alt"></i>
        </section>
        <button class="btn" type="submit" id="loginBtn">
            Se connecter
        </button>
    </form>

    
    <script>
        // Animation du bouton lors de la soumission
        document.getElementById('loginBtn').addEventListener('click', function(e) {
            this.classList.add('loading');
            this.innerHTML = '';
            
            // Simulation du chargement (à retirer en production)
            setTimeout(() => {
                this.classList.remove('loading');
                this.innerHTML = 'Se connecter';
            }, 2000);
        });

        // Animation des champs de saisie
        document.querySelectorAll('input').forEach(input => {
            input.addEventListener('focus', function() {
                this.parentElement.style.transform = 'scale(1.02)';
            });
            
            input.addEventListener('blur', function() {
                this.parentElement.style.transform = 'scale(1)';
            });
        });

        document.querySelector('form').addEventListener('submit', async function (e) {
        e.preventDefault(); // Empêche le rechargement

        const username = document.getElementById('username').value;
        const password = document.getElementById('password').value;
        const loginBtn = document.getElementById('loginBtn');
        const errorMessage = document.getElementById('error-message');

        loginBtn.classList.add('loading');
        loginBtn.innerHTML = '';

        try {
            const response = await fetch('/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password })
            });

            const result = await response.json();

            if (response.ok) {
                window.location.href = '/choixCourseAdmin.html'; // Redirige vers la page admin si succès
            } else {
                errorMessage.textContent = result.message || 'Identifiant ou mot de passe incorrect.';
                errorMessage.style.display = 'block';
            }
        } catch (error) {
            errorMessage.textContent = 'Une erreur est survenue.';
            errorMessage.style.display = 'block';
        } finally {
            loginBtn.classList.remove('loading');
            loginBtn.innerHTML = 'Se connecter';
        }
    });

    document.querySelectorAll('input').forEach(input => {
        input.addEventListener('focus', function () {
            this.parentElement.style.transform = 'scale(1.02)';
        });
        input.addEventListener('blur', function () {
            this.parentElement.style.transform = 'scale(1)';
        });
    });
    </script>
</body>
</html>
