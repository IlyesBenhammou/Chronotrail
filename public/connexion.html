<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" type="text/css" href="style_con.css">
    <title>Connexion</title>
</head>
<body>
    <form class ="container" action="/login" method="POST">
        <h1>Connexion</h1>
        <section class="input-box">
            <input type="text" id="username" name="username" placeholder="Identifiant" required>
            <i class="bx bxs-lock-user"> </i>
        </section>
        <section class="input-box" >
            <input type="password" id="password" name="password" placeholder="Mot de passe" required>
            <i class="bx bxs-lock-user"> </i>
        </section>

        <section class="forgot-password">
            <a class="forgot-password-link" href="mdp_oublie.html"> mot de passe oublié ?
            </a>
        </section>
        

        <button class="login-button" type="submit">Se connecter</button>
    </form>
</body>
</html>
